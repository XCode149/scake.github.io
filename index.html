<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Insta-like</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #fffaf8;
      color: #3c2f2f;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }

    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.03);
    }

    /* --- POPUP --- */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }

    .popup img {
      width: 70%;
      max-width: 800px;
      border-radius: 10px;
    }

    .popup .close {
      position: absolute;
      top: 20px; right: 30px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }

    .popup .arrow {
      position: absolute;
      top: 50%;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .arrow.left { left: 30px; }
    .arrow.right { right: 30px; }

    /* --- LIKE HEART --- */
    .heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      color: rgba(255,0,0,0.8);
      pointer-events: none;
      animation: pop 0.6s ease forwards;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    /* --- COMMENTAIRES --- */
    .comments {
      margin-top: 15px;
      background: #fff;
      width: 70%;
      max-width: 800px;
      border-radius: 10px;
      padding: 10px 15px;
      color: #333;
    }

    .comments p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <!-- TES IMAGES -->
  <img src="https://picsum.photos/400?random=1" alt="img1">
  <img src="https://picsum.photos/400?random=2" alt="img2">
  <img src="https://picsum.photos/400?random=3" alt="img3">
  <img src="https://picsum.photos/400?random=4" alt="img4">

  <!-- POPUP -->
  <div class="popup" id="popup">
    <span class="close" id="close">&times;</span>
    <span class="arrow left" id="prev">&#10094;</span>
    <span class="arrow right" id="next">&#10095;</span>
    <img id="popupImg" src="" alt="">
    <div class="comments" id="commentsContainer">
      <!-- 💬 Tu peux écrire tes commentaires ici -->
      <p><strong>lucas_34 :</strong> Trop belle lumière 🔥</p>
      <p><strong>emma.art :</strong> Wow le style est incroyable 😍</p>
    </div>
  </div>

  <script>
    const images = document.querySelectorAll("body > img");
    const popup = document.getElementById("popup");
    const popupImg = document.getElementById("popupImg");
    const closeBtn = document.getElementById("close");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const comments = document.getElementById("commentsContainer");

    let currentIndex = 0;

    function openPopup(index) {
      currentIndex = index;
      popupImg.src = images[index].src;
      popup.style.display = "flex";
    }

    function closePopup() {
      popup.style.display = "none";
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % images.length;
      popupImg.src = images[currentIndex].src;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      popupImg.src = images[currentIndex].src;
    }

    images.forEach((img, index) => {
      img.addEventListener("click", () => openPopup(index));

      img.addEventListener("dblclick", (e) => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        img.parentElement.appendChild(heart);
        setTimeout(() => heart.remove(), 600);
      });
    });

    closeBtn.addEventListener("click", closePopup);
    next.addEventListener("click", showNext);
    prev.addEventListener("click", showPrev);

    popup.addEventListener("dblclick", (e) => {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      popup.appendChild(heart);
      setTimeout(() => heart.remove(), 600);
    });

    window.addEventListener("keydown", (e) => {
      if (popup.style.display === "flex") {
        if (e.key === "ArrowRight") showNext();
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "Escape") closePopup();
      }
    });
  </script>

</body>
</html>
